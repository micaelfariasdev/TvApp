<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · TVBox</title><style>
:root{color-scheme:dark;--panel:#121d30;--line:#283a58;--text:#edf4ff;--muted:#9eb0ca;--accent:#55a7ff;--danger:#ff6574}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#19345a,#09111f 55%);color:var(--text);font:15px Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1300px;margin:auto;padding:32px 24px 60px}.top{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:28px;font-weight:800}.brand small,.muted{color:var(--muted);font-weight:500}.nav,.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--text);text-decoration:none;background:#17253d;font-weight:700;cursor:pointer}.btn.primary{border:0;background:var(--accent);color:#061324}.btn.danger{color:#fff;background:#5a2332;border-color:#7e3346}.panel{background:rgba(18,29,48,.93);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:24px;box-shadow:0 14px 35px #0005}h1,h2,h3{margin:0 0 12px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#a9c9f5;font-size:12px;text-transform:uppercase;letter-spacing:.08em}td.url{max-width:390px;word-break:break-word;color:var(--muted)}input,select{width:100%;background:#0b1628;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}label{display:block;font-weight:700;margin:14px 0 7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{border:1px solid var(--line);background:#0c1729;border-radius:13px;padding:16px}.badge{display:inline-block;background:#213a5d;color:#bdddff;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:700px){.wrap{padding:20px 14px}table{display:block;overflow-x:auto}.hide-mobile{display:none}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">TVBox <small>Painel de catálogo</small></div><nav class="nav"><a class="btn" href="/tvbox?pass={{password}}">Canais</a><a class="btn" href="/tvbox/series?pass={{password}}">Séries</a></nav></header>{{body}}</main></body></html>
