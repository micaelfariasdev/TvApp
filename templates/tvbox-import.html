<section class="panel" style="max-width:700px"><h1>Importar catálogo M3U</h1><p class="muted">Selecione o JSON gerado pelo botão “Baixar todos do filtro” no catálogo M3U.</p><form method="post" enctype="multipart/form-data" action="/tvbox/import/m3u?pass={{password}}"><label>Arquivo do catálogo</label><input type="file" name="catalog" accept="application/json,.json" required><label>Destino</label><select id="importTarget" name="target"><option value="channels">Canais e filmes</option><option value="episodes">Episódios de uma série</option></select><div id="episodeTarget" hidden><label>Série</label><select name="seriesId">{{seriesOptions}}</select><label>Temporada</label><input type="number" name="seasonNumber" min="1" value="1"><label>Número inicial do episódio</label><input type="number" name="startEpisode" min="1" value="1"></div><div class="actions" style="margin-top:20px"><button class="btn primary" type="submit">Importar</button><a class="btn" href="/tvbox?pass={{password}}">Cancelar</a></div></form></section><script>const target=document.querySelector('#importTarget'),episodeTarget=document.querySelector('#episodeTarget');target.onchange=()=>episodeTarget.hidden=target.value!=='episodes';</script>
