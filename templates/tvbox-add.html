<section class="panel" style="max-width:700px"><h1>Adicionar canal ou filme</h1><form method="POST" action="/tvbox/add?pass={{password}}"><label>Nome</label><input type="text" name="name" required><label>URL (.mp4, .m3u8 ou API)</label><input type="url" name="url" required><label>Tipo</label><select name="type"><option value="mp4">MP4</option><option value="hls">HLS</option><option value="kick">Kick</option></select><label>Categoria</label><select name="category"><option value="filmes">Filmes</option><option value="futebol">Futebol</option><option value="kick">Kick</option></select><div class="actions" style="margin-top:20px"><button class="btn primary" type="submit">Salvar item</button><a class="btn" href="/tvbox?pass={{password}}">Cancelar</a></div></form></section>
