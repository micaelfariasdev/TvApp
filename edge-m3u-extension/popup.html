<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TVBox M3U Collector</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Coletor M3U</h1>
      <p class="hint">Captura requisições GET (sem CSS/POST) na memória.</p>
      
      <div class="row">
        <button id="toggle-master" type="button" style="background: #211d2b; border-color: #554b68;">Focar master.txt: OFF</button>
        <button id="refresh" type="button">Atualizar lista</button>
        <button id="filter-extm3u" type="button" style="background: #3b2c5e; border-color: #8c6bc4;">Filtrar #EXTM3U</button>
      </div>
      
      <div class="row" style="margin-top: 6px;">
        <button id="download-json" type="button" style="background: #234e38; border-color: #3e8e63;">Baixar JSON</button>
        <button id="clear-requests" type="button">Limpar lista</button>
      </div>

      <div style="margin-top: 10px;">
        <button id="toggle-batch" type="button" style="background: #211d2b; border-color: #554b68;">Modo lote: OFF</button>
      </div>

      <div id="batch-selection-tools" class="row" hidden>
        <button id="select-all" type="button">Selecionar todos</button>
        <button id="clear-selection" type="button">Limpar seleção</button>
      </div>
      <p id="batch-selection-status" class="hint" hidden>Nenhum link selecionado.</p>

      <label for="playlists" id="playlists-label">Requisição com m3u</label>
      <select id="playlists" size="1">
        <option value="">Nenhuma requisição capturada ainda</option>
      </select>

      <div id="manual-section">
        <div id="manual-single">
          <label for="manual-url">URL da playlist (opcional)</label>
          <input id="manual-url" type="url" placeholder="Cole aqui a URL master.txt ou .m3u8">
          <button id="use-manual-url" type="button">Usar URL colada</button>
        </div>
        <div id="manual-batch" hidden>
          <label for="manual-urls">Vários links (um por linha)</label>
          <textarea id="manual-urls" rows="4" placeholder="https://site/playlist1.m3u8&#10;https://site/playlist2.m3u8"></textarea>
          <button id="use-manual-urls" type="button">Carregar links colados</button>
        </div>
      </div>

      <label for="server">Servidor (URL base)</label>
      <input id="server" type="url" value="http://164.152.62.129" readonly>
      
      <label for="token">Token da extensão</label>
      <input id="token" type="password" autocomplete="off" placeholder="Configure no servidor">

      <label for="kind">Adicionar como</label>
      <select id="kind">
        <option value="channel">Canal</option>
        <option value="movie">Filme</option>
        <option value="series">Série / episódio</option>
      </select>

      <section id="item-fields">
        <div id="single-title-group">
          <label id="single-title-label" for="title">Nome do canal, filme ou episódio</label>
          <input id="title" type="text" maxlength="200" placeholder="Título">
        </div>

        <div id="batch-titles-container" hidden style="margin-top: 10px; max-height: 200px; overflow-y: auto; border: 1px solid #554b68; padding: 8px; border-radius: 7px; background: #181522;">
          <label id="batch-titles-heading" style="margin-top: 0; color: #9c73ef;">Títulos individuais para os itens selecionados:</label>
          <p id="batch-titles-help" hidden style="margin: 0 0 8px; color: #bdb4ce; font-size: 12px;">Edite o nome de cada episódio; os números serão atribuídos em sequência.</p>
          <div id="batch-inputs-list"></div>
        </div>
        
        <div id="category-field">
          <label for="category">Categoria</label>
          <input id="category" type="text" maxlength="100" value="m3u" placeholder="m3u">
        </div>
        
        <div id="series-fields" hidden>
          <label for="series-select">Série cadastrada no servidor</label>
          <select id="series-select">
            <option value="">Carregando séries...</option>
          </select>
          <button id="refresh-series" type="button">Atualizar séries</button>
          
          <div id="new-series-fields" hidden>
            <label for="series-title">Nome da nova série</label>
            <input id="series-title" type="text" maxlength="200" placeholder="Nome da série">
            <label for="series-id">ID da nova série</label>
            <input id="series-id" type="text" maxlength="80" placeholder="nome-da-serie">
          </div>
          
          <div class="row">
            <div>
              <label for="season">Temporada</label>
              <input id="season" type="number" min="1" max="999" value="1">
            </div>
            <div>
              <label for="episode">Episódio Inicial</label>
              <input id="episode" type="number" min="1" max="9999" value="1">
            </div>
          </div>
        </div>
      </section>

      <button id="save" class="primary" type="button">Adicionar ao servidor</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
