<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo M3U</title>
  <style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1020;color:#eef3ff}*{box-sizing:border-box}body{margin:0}header{padding:26px max(20px,5vw);background:#13224a}h1{margin:0;font-size:30px}main{padding:24px max(20px,5vw)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}input,select,button{min-height:42px;border:1px solid #35466e;border-radius:9px;background:#131d35;color:white;padding:0 12px;font:inherit}input{width:min(440px,100%)}button{cursor:pointer;background:#2563eb;border:0;font-weight:700}.summary{color:#aebbd6;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{overflow:hidden;border:1px solid #293b5d;border-radius:12px;background:#131d35}.art{width:100%;height:120px;object-fit:cover;background:#223352}.fallback{height:120px;display:grid;place-items:center;background:#223352;font-size:32px}.content{padding:12px}.title,.meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title{font-weight:750}.meta{color:#9eaecc;font-size:.82rem;margin:7px 0 12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions a,.actions button{min-height:33px;display:grid;place-items:center;text-decoration:none;background:#263a60;color:white;border-radius:7px;font-size:.82rem}.actions button{padding:0}.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin:28px 0}.empty{padding:45px;color:#aebbd6;text-align:center;grid-column:1/-1}</style>
</head>
<body><header><h1>Catálogo M3U</h1></header><main>
  <div class="controls"><input id="search" placeholder="Pesquisar título, grupo ou ID"><select id="group"><option value="">Todos os grupos</option></select><button id="importM3u" type="button">Importar novo M3U</button><input id="m3uFile" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" hidden><button id="downloadAll" type="button">Baixar todos do filtro</button></div>
  <div id="summary" class="summary">Carregando...</div><section id="grid" class="grid"></section>
  <div class="pagination"><button id="previous">Anterior</button><span id="page"></span><button id="next">Próxima</button></div>
</main><script>
const grid=document.querySelector('#grid'),summary=document.querySelector('#summary'),group=document.querySelector('#group'),search=document.querySelector('#search'),pageLabel=document.querySelector('#page'),m3uFile=document.querySelector('#m3uFile');let page=1,data={hasMore:false};
const esc=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
async function loadGroups(){const response=await fetch('/api/groups');for(const item of await response.json())group.add(new Option(`${item.name||'Sem grupo'} (${item.total})`,item.name));}
const card=item=>{const image=item.logo?`<img class="art" loading="lazy" src="${esc(item.logo)}" onerror="this.outerHTML='<div class=\\'fallback\\'>▶</div>'">`:'<div class="fallback">▶</div>';return `<article class="card">${image}<div class="content"><div class="title" title="${esc(item.title)}">${esc(item.title)}</div><div class="meta">${esc(item.groupName||item.tvgId||'Sem grupo')}</div><div class="actions"><a href="${esc(item.url)}" target="_blank" rel="noopener">Abrir</a><button data-url="${esc(item.url)}">Copiar</button></div></div></article>`;};
async function load(){const term=search.value.trim();if(term.length===1){summary.textContent='Digite pelo menos 2 caracteres para pesquisar.';grid.innerHTML='';return;}const params=new URLSearchParams({page,pageSize:24,q:term,group:group.value});summary.textContent='Carregando...';const response=await fetch('/api/channels?'+params);data=await response.json();data.hasMore=data.hasMore ?? (data.page<data.pages);summary.textContent=`${data.channels.length} itens nesta página`;pageLabel.textContent=`Página ${data.page}`;document.querySelector('#previous').disabled=data.page<=1;document.querySelector('#next').disabled=!data.hasMore;grid.innerHTML=data.channels.length?data.channels.map(card).join(''):'<div class="empty">Nenhum item encontrado.</div>';}
grid.addEventListener('click',async event=>{const url=event.target.dataset.url;if(url){try{await navigator.clipboard.writeText(url);event.target.textContent='Copiado!';}catch{prompt('Copie o link:',url);}}});let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load();},350);});group.addEventListener('change',()=>{page=1;load();});document.querySelector('#previous').onclick=()=>{if(page>1){page--;load();}};document.querySelector('#next').onclick=()=>{if(data.hasMore){page++;load();}};document.querySelector('#downloadAll').onclick=()=>{const term=search.value.trim();if(term.length===1){alert('Digite pelo menos 2 caracteres ou escolha um grupo.');return;}const params=new URLSearchParams({q:term,group:group.value});window.location.href='/api/export/tvbox.json?'+params;};load();loadGroups();
document.querySelector('#importM3u').onclick=()=>m3uFile.click();
m3uFile.addEventListener('change',async()=>{const file=m3uFile.files[0];if(!file)return;const button=document.querySelector('#importM3u');button.disabled=true;button.textContent='Importando...';try{const response=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:await file.text()});const result=await response.json();if(!response.ok)throw new Error(result.error||'Falha ao importar o arquivo.');const details=[`${result.added} novidades adicionadas`,`${result.alreadyImported} já existentes ignorados`];if(result.duplicates)details.push(`${result.duplicates} duplicatas no arquivo ignoradas`);alert(details.join('; ')+'.');await Promise.all([loadGroups(),load()]);}catch(error){alert(error.message||'Não foi possível importar o arquivo.');}finally{button.disabled=false;button.textContent='Importar novo M3U';m3uFile.value='';}});
</script></body></html>
