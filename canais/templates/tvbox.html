<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>{{title}} · TVBox</title>
    <style>
      :root {
        --ink: #f4f7fb;
        --muted: #98a7bd;
        --canvas: #070a10;
        --surface: #111722;
        --surface2: #171f2d;
        --line: #293448;
        --blue: #68a5ff;
        --blue2: #3c75e8;
        --danger: #ff6576;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: radial-gradient(900px 460px at 8% -8%, #1d3e77 0%, transparent 62%), var(--canvas);
        color: var(--ink);
        font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(#ffffff05 1px, transparent 1px), linear-gradient(90deg, #ffffff04 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(#000 70%, transparent 100%);
      }

      .wrap {
        width: min(100% - 32px, 1420px);
        margin: auto;
        padding: 24px 0 64px;
        position: relative;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 21px;
        font-weight: 850;
        letter-spacing: -0.03em;
      }

      .brand::before,
      .brand-mark {
        content: "▶";
        display: grid;
        place-items: center;
        width: 39px;
        height: 39px;
        border-radius: 13px;
        color: white;
        background: linear-gradient(135deg, #77b5ff, #4b6eea);
        box-shadow: 0 9px 25px #306dec66;
        font-size: 14px;
      }

      .brand small,
      .muted {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .nav .btn {
        background: transparent;
        border-color: transparent;
      }

      .nav .btn:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .app-navigation {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 20px;
      }

      .app-navigation form,
      .actions form {
        margin: 0;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 9px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface2);
        color: var(--ink);
        text-decoration: none;
        font: 700 13px inherit;
        cursor: pointer;
        transition: transform 0.18s, background 0.18s, border-color 0.18s;
      }

      .btn:hover {
        transform: translateY(-1px);
        border-color: #5577af;
        background: #202c40;
      }

      .btn.primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--blue), var(--blue2));
        color: #071120;
        box-shadow: 0 8px 20px #3776dd4d;
      }

      .btn.danger {
        color: #ffd9df;
        background: #3a1d28;
        border-color: #713442;
      }

      .panel {
        margin-top: 20px;
        padding: 24px;
        background: linear-gradient(145deg, #151c29ef, #0e141ef5);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }

      .panel:first-of-type {
        margin-top: 0;
      }

      h1, h2, h3 {
        margin: 0 0 8px;
        letter-spacing: -0.035em;
        line-height: 1.2;
      }

      h1 { font-size: 28px; }
      h2 { font-size: 20px; }
      h3 { font-size: 16px; }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 16px;
      }

      .card {
        padding: 18px;
        background: linear-gradient(140deg, #192333, #111823);
        border: 1px solid #2a394f;
        border-radius: 15px;
        transition: transform 0.18s, border-color 0.18s;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: #4b6f9f;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 10px;
        border-radius: 99px;
        background: #274265;
        color: #b8d9ff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }

      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }

      label {
        display: block;
        margin: 16px 0 6px;
        color: #dbe7f8;
        font-size: 13px;
        font-weight: 700;
      }

      input, select {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: 0;
        background: #080d16;
        color: var(--ink);
        font: inherit;
        transition: border-color 0.18s, box-shadow 0.18s;
      }

      input:focus, select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(95, 158, 255, 0.15);
      }

      .table-responsive {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }

      th, td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid #243044;
        vertical-align: middle;
      }

      th {
        color: #93a9c8;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      td.url {
        max-width: 390px;
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
      }

      .login-shell {
        width: min(100%, 420px);
        margin: 10vh auto 0;
        padding: 32px;
        background: linear-gradient(145deg, #182237, #0e141f);
        border: 1px solid #344665;
        border-radius: 24px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.6);
      }

      .login-brand {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 24px;
      }

      .login-brand .brand-mark {
        font-size: 15px;
      }

      .login-brand strong {
        display: block;
        font-size: 20px;
      }

      .login-brand small {
        display: block;
        color: var(--muted);
        margin-top: 2px;
      }

      .login-shell h1 {
        font-size: 24px;
      }

      .login-shell > p {
        color: var(--muted);
        line-height: 1.5;
        margin-top: 6px;
      }

      .login-message {
        padding: 12px;
        border: 1px solid #70404b;
        background: #371e27;
        border-radius: 10px;
        color: #ffccd3;
        font-size: 14px;
      }

      .login-submit {
        width: 100%;
        margin-top: 24px;
        min-height: 46px;
      }

      @media (max-width: 768px) {
        .wrap {
          width: min(100% - 24px, 1420px);
          padding-top: 16px;
        }

        .top {
          flex-direction: column;
          align-items: flex-start;
          gap: 16px;
        }

        .nav {
          width: 100%;
          justify-content: flex-start;
        }

        .app-navigation {
          flex-direction: column;
          align-items: stretch;
        }

        .app-navigation .btn,
        .app-navigation form,
        .app-navigation form .btn {
          width: 100%;
        }

        .panel {
          padding: 16px;
          border-radius: 16px;
        }

        h1 {
          font-size: 22px;
        }

        .hide-mobile {
          display: none !important;
        }

        .login-shell {
          margin-top: 4vh;
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="brand">TVBox <small>Painel de catálogo</small></div>
        <nav class="nav">
          <a class="btn" href="/tvbox/kick">Kick</a>
          <a class="btn" href="/tvbox">Painel</a>
          <a class="btn" href="/tvbox/home">Home</a>
          <a class="btn" href="/tvbox/series">Séries</a>
        </nav>
      </header>
      {{body}}
    </main>
  </body>
</html>
