<section class="panel" style="max-width:960px; margin: 40px auto; background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); font-family: system-ui, -apple-system, sans-serif; color: #f3f4f6;">
  
  <!-- Cabeçalho -->
  <div class="row" style="display: flex; flex-direction: column; gap: 8px;">
    <div>
      <a class="btn" href="/tvbox/categories" style="display: inline-flex; align-items: center; gap: 6px; color: #60a5fa; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s;" onmouseover="this.style.color='#93c5fd'" onmouseout="this.style.color='#60a5fa'">
        ← Voltar para Categorias
      </a>
      <h1 style="margin: 12px 0 4px 0; font-size: 28px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px;">{{categoryName}}</h1>
      <p class="muted" style="margin: 0; color: #9ca3af; font-size: 14px;">Gerencie a capa e visualize os itens desta categoria.</p>
    </div>
  </div>

  <!-- Formulário de Capa -->
  <form method="post" action="/tvbox/category/{{categorySlug}}/poster" class="row" style="margin: 28px 0; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; background: #1f2937; padding: 20px; border-radius: 12px; border: 1px solid #374151;">
    <div style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 6px;">
      <label style="font-size: 13px; font-weight: 600; color: #d1d5db; text-transform: uppercase; letter-spacing: 0.5px;">Capa da Categoria (Poster)</label>
      <input type="url" name="poster" value="{{poster}}" placeholder="https://site.com/capa-categoria.jpg" style="width: 100%; background: #111827; border: 1px solid #4b5563; border-radius: 8px; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#4b5563'">
    </div>
    <button class="btn primary" type="submit" style="background: #2563eb; color: white; border: none; padding: 12px 22px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; font-size: 14px;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">Salvar Capa</button>
  </form>

  <!-- Lista de Itens -->
  <h2 style="margin-top: 36px; font-size: 20px; font-weight: 600; color: #ffffff; border-bottom: 1px solid #1f2937; padding-bottom: 10px;">Itens nesta Categoria</h2>
  <div class="category-items" style="margin-top: 18px;">
    {{itemsRows}}
  </div>
</section>
