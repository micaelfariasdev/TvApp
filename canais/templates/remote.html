<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle TV Box</title>
<style>body{margin:0;background:#0d1422;color:#f5f7fb;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.remote{width:min(420px,92vw);background:#182235;border:1px solid #2d3a52;border-radius:22px;padding:22px;box-shadow:0 15px 45px #0008}h1{font-size:22px;margin:0 0 16px}.connect{display:flex;gap:8px;margin-bottom:16px}input,button{border:0;border-radius:12px;padding:13px;font:inherit}input{min-width:0;flex:1;background:#0d1422;color:white}button{background:#2e3d58;color:#fff;cursor:pointer;font-weight:600}button:active{background:#10a7df;transform:scale(.96)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.grid button{height:58px}.wide{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.status{color:#aebbd0;min-height:24px;font-size:14px}</style></head><body><main class="remote"><h1>Controle da TV Box</h1><div class="connect"><input id="device" placeholder="192.168.1.20:5555"><button onclick="connect()">Conectar</button></div><div id="status" class="status">Informe o IP da TV Box.</div><div class="grid"><span></span><button data-key="up">▲</button><span></span><button data-key="left">◀</button><button data-key="ok">OK</button><button data-key="right">▶</button><span></span><button data-key="down">▼</button><span></span></div><div class="wide"><button data-key="back">↩ Voltar</button><button data-key="home">⌂ Home</button><button data-key="volup">🔊 Volume +</button><button data-key="voldown">🔉 Volume −</button><button data-key="play">▶ Play</button><button data-key="pause">Ⅱ Pausar</button><button data-key="mute">🔇 Mudo</button><button data-key="stop">■ Parar</button></div></main><script>
const statusEl=document.querySelector('#status');async function readJson(r){const text=await r.text();try{return JSON.parse(text)}catch(e){throw Error('Servidor retornou HTTP '+r.status+' em vez de JSON. Reinicie o Node/PM2 e confirme a URL /remote.')}}async function connect(){const device=document.querySelector('#device').value.trim();try{const r=await fetch('./api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device})});const j=await readJson(r);statusEl.textContent=j.error||('Conectado: '+j.device)}catch(e){statusEl.textContent=e.message}}async function key(key){try{const r=await fetch('./api/key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const j=await readJson(r);if(j.error)statusEl.textContent=j.error}catch(e){statusEl.textContent=e.message}}document.querySelectorAll('[data-key]').forEach(b=>{b.onclick=()=>key(b.dataset.key)});document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back'};if(m[e.key]){e.preventDefault();key(m[e.key])}});
</script></body></html>
